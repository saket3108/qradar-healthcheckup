name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: qhc, POSTGRES_PASSWORD: qhc, POSTGRES_DB: qhc_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qhc" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      QHC_TEST_DATABASE_URL: postgresql+psycopg://qhc:qhc@localhost:5432/qhc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: cd pptx_gen && npm install --omit=dev --no-audit --no-fund
      - name: Migrate test database
        run: QHC_DATABASE_URL="$QHC_TEST_DATABASE_URL" alembic upgrade head
      - name: Tests (coverage gate in pytest.ini)
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, tags: qhc-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ./frontend, push: false, tags: qhc-web:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
