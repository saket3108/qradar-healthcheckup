# Single entry point: serves the SPA and proxies /api to the FastAPI service.
# Tuned for multi-GB get_logs uploads (chunked PUTs, but a direct upload must also work).
upstream qhc_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Uploads and downloads can be very large; the API enforces its own limits (QHC_MAX_UPLOAD_BYTES).
    client_max_body_size 0;
    client_body_timeout 3600s;
    send_timeout 3600s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    location /api/ {
        proxy_pass http://qhc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream request bodies straight to the API instead of spooling multi-GB files to nginx's disk.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;   # SPA fallback
    }
}
